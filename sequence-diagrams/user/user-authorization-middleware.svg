@startuml
!theme plain
skinparam backgroundColor #FFFFFF
skinparam sequenceArrowThickness 2
skinparam roundcorner 20
skinparam maxmessagesize 60

actor Client
participant "UserRouter" as Router
participant "AuthMiddleware" as Auth
participant "UserController" as Controller
participant "UserService" as Service
participant "UserModel" as Model
participant "Redis" as Redis
participant "JWT" as JWT
participant "Email" as Email
participant "Cloudinary" as Cloud
participant "ErrorHandler" as Error


== Authorization Middleware Flow ==
Router -> Auth: authorizeRoles(...roles)
Auth -> Auth: extract user from req.user
Auth -> Auth: const role = user?.role
Auth -> Auth: check if roles.includes(role)

alt Role not authorized
    Auth -> Error: `Role: ${role} is not allowed\nto access this resource`, 403
    Error - -> Client: 403 Forbidden
else Role authorized
    Auth - -> Router: next() - continue
end
@enduml

